[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibra"
version = "0.1.0"
description = "Uncertainty quantification for language model outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["uncertainty-quantification", "llm", "calibration", "nlp", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.35",
    "accelerate>=0.24",
    "sentence-transformers>=2.2",
    "datasets>=2.14",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "rouge-score>=0.1.2",
    "nltk>=3.8",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.41"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.23",
]

[project.urls]
Repository = "https://github.com/tiago/calibra"

[tool.hatch.build.targets.wheel]
packages = ["calibra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["calibra"]
