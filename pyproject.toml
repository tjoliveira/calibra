[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-uq"
version = "0.1.0"
description = "Uncertainty quantification for language model outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["uncertainty-quantification", "llm", "calibration", "nlp", "huggingface", "uq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.35",
    "accelerate>=0.24",
    "sentence-transformers>=2.2",
    "datasets>=2.14",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "rouge-score>=0.1.2",
    "nltk>=3.8",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.41"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.23",
]

[project.urls]
Homepage = "https://github.com/tjoliveira/llm-uq"
Repository = "https://github.com/tjoliveira/llm-uq"
"Bug Tracker" = "https://github.com/tjoliveira/llm-uq/issues"

[tool.hatch.build.targets.wheel]
packages = ["llm_uq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["llm_uq"]
